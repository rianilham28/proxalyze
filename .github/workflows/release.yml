name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - if: ${{ matrix.apt }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/proxalyze"
          strip "$bin" || true
          dist="dist/proxalyze-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$dist"
          cp "$bin" README.md "$dist/"
          tar -C dist -czf "dist/proxalyze-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            "$(basename "$dist")"
          sha256sum "dist/proxalyze-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" \
            > "dist/proxalyze-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: dist/*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Validator-only build. `proxalyze -i proxies.txt` → `proxies.txt` +
            `proxies.jsonl` raw judged output. See README for the measurement
            notes behind the defaults. Checksums in the `.sha256` assets.
